name: Validate v2
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: faceads_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: faceads_v2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U faceads_test -d faceads_v2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://faceads_test:local_ci_only@127.0.0.1:5432/faceads_v2_test
      DATABASE_URL_TEST: postgresql://faceads_test:local_ci_only@127.0.0.1:5432/faceads_v2_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run check:publication
      - run: npm ci
      - run: npm run check:railway
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t faceads-mcp-v2:ci .
