# Optional local PostgreSQL only. Credentials below are synthetic local defaults.
name: faceads-mcp-v2
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:55437:5432"
    environment:
      POSTGRES_USER: faceads
      POSTGRES_PASSWORD: faceads_local_only
      POSTGRES_DB: faceads_v2
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceads -d faceads_v2"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  pgdata:
